server {
    LISTEN_DIRECTIVES
    server_name localhost;

    # Servir arquivos estáticos da SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Redirecionar todas as rotas desconhecidas para index.html (SPA routing do React Router)
        try_files $uri $uri/ /index.html;
    }

    # Cache longo para bundles estáticos versionados gerados pelo Vite
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
